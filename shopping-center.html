  <main class="wrap">
    <div id="homeView">
    <header class="top"><div class="brand"><div class="mark">🛍️</div><div><div class="eyebrow">MY SHOPPING JOURNAL</div><h1>日常採購簿</h1></div></div><button class="settings" id="openSettings">⚙ 刷卡手續費設定</button></header>
    
    <section class="stats" aria-label="購物摘要"><div class="stat"><label>追蹤中</label><strong id="statActive">0 <small>件商品</small></strong></div><div class="stat"><label>待出貨</label><strong id="statShipping">0 <small>件商品</small></strong></div><div class="stat"><label>已記錄總額</label><strong id="statTotal">NT$0</strong></div></section>
    <section class="layout">
      <form class="card form-card" id="itemForm"><h3 id="formTitle">新增一筆採購</h3><p class="sub">記下商品資訊，之後也能隨時更新狀態。</p>
        <div class="field"><label for="name">商品名稱</label><input id="name" required maxlength="120" placeholder="例如：春季限定托特包"></div>
        <div class="field"><label for="url">商品連結 <span class="optional">選填</span></label><input id="url" type="url" placeholder="https://..."></div>
        <div class="field"><label for="store">店家名稱</label><input id="store" required maxlength="80" placeholder="例如：樂天市場店鋪名稱"></div>
        <div class="row"><div class="field"><label for="orderStatus">下單狀態</label><select id="orderStatus"><option value="ordered">已下單</option><option value="unordered">未下單</option></select></div><div class="field" id="orderDateField"><label for="orderDate">下單日期</label><input id="orderDate" type="date" required></div></div>
        <div class="row"><div class="field"><label for="shipDate">預計出貨日期</label><input id="shipDate" type="date"></div><div class="field"><label for="preorder">預購商品</label><select id="preorder"><option value="no">否</option><option value="yes">是</option></select></div></div>
        <div class="field hidden" id="preorderDeadlineField"><label for="preorderDeadline">預購截止日期</label><input id="preorderDeadline" type="date"></div>
        <div class="field"><label for="price">商品價格（台幣）</label><div class="price-row"><input id="price" type="number" min="0" step="1" required placeholder="輸入台幣金額"></div><div class="rate-note" id="rateNote">輸入台幣金額，自動估算刷卡手續費</div><div class="calc"><span>含刷卡手續費估算</span><strong id="estimate">NT$0</strong></div></div>
        <div class="actions"><button class="primary" type="submit" id="saveBtn">加入追蹤清單</button><button class="secondary hidden" type="button" id="cancelEdit">取消</button></div>
      </form>
      <section class="card list-card"><div class="list-head"><div><h3>我的採購清單 <span class="count" id="listCount">0 件</span></h3></div><div class="tools"><input class="search" id="search" type="search" placeholder="搜尋商品或店家…" aria-label="搜尋"><select class="sort" id="sortBy" aria-label="排序方式"><option value="createdAt">登記日期</option><option value="orderDate">下單日期</option><option value="shipDate">預計出貨日期</option><option value="store">店家名稱</option></select><button class="sort-dir" id="sortDir" aria-label="切換排序方向" title="切換排序方向">↓</button></div></div><div class="tabs"><button class="tab active" data-tab="pending">未收貨 <span id="homePendingCount">0</span></button><button class="tab" data-tab="received">已收貨 <span id="homeReceivedCount">0</span></button></div><div class="items" id="items"></div><a class="more-link hidden" id="seeMore" href="#list">查看更多 →</a><p class="footnote">台幣價格加計你設定的信用卡外幣手續費率。此為估算值，實際金額請以發卡銀行帳單為準。</p></section>

    <section id="listView" class="hidden">
      <header class="list-page-head"><a href="#home" class="back-link">← 返回採購簿</a><h2>完整採購清單</h2><p>每頁顯示 15 筆商品</p></header>
      <section class="card list-card"><div class="list-head"><h3>我的採購清單 <span class="count" id="allListCount">0 件</span></h3><div class="tools"><input class="search" id="allSearch" type="search" placeholder="搜尋商品或店家…" aria-label="搜尋"><select class="sort" id="allSortBy" aria-label="排序方式"><option value="createdAt">登記日期</option><option value="orderDate">下單日期</option><option value="shipDate">預計出貨日期</option><option value="store">店家名稱</option></select><button class="sort-dir" id="allSortDir" aria-label="切換排序方向" title="切換排序方向">↓</button></div></div><div class="tabs"><button class="tab active" data-tab="pending">未收貨 <span id="allPendingCount">0</span></button><button class="tab" data-tab="received">已收貨 <span id="allReceivedCount">0</span></button></div><div class="items" id="allItems"></div><nav class="pagination" id="pagination" aria-label="清單分頁"></nav></section>
    </section>
  </main>
  <dialog class="dialog" id="settingsDialog"><form method="dialog" id="settingsForm"><h3>刷卡手續費設定</h3><p>依你的信用卡方案填入手續費率，預設為 1.5%。估算金額＝台幣價格 ×（1＋手續費率）。</p><div class="field"><label for="fee">信用卡手續費</label><input id="fee" type="number" min="0" max="20" step="0.01"><div class="rate-note">以百分比輸入，例如 1.5 表示 1.5%</div></div><div class="dialog-actions"><button type="button" class="secondary" id="closeSettings">取消</button><button class="primary" style="flex:initial" value="save">儲存設定</button></div></form></dialog>
  <div class="notice" id="notice" role="status"></div>
  <script>
  (()=>{
    const KEY='shopping-journal-v1', SETKEY='shopping-journal-settings-v1';
    const $=id=>document.getElementById(id), today=new Date().toISOString().slice(0,10);
    let entries=[],settings={fee:1.5},editing=null,dir=-1,timer,activeTab='pending',detailPage=1,searchTerm='',sortKey='createdAt';
    try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch{entries=[]}
    try{settings={...settings,...JSON.parse(localStorage.getItem(SETKEY)||'{}')}}catch{}
    // Preserve records created by the earlier foreign-currency version as their recorded TWD estimate.
    entries.forEach(e=>{if(e.currency&&e.currency!=='TWD'&&e.rate)e.price=Math.round(e.price*e.rate);e.currency='TWD';e.rate=1;e.fee=Number(e.fee??settings.fee);e.orderStatus=e.orderStatus||'ordered';e.preorder=Boolean(e.preorder);e.preorderDeadline=e.preorderDeadline||''});
    const fmt=(n,cur='TWD')=>new Intl.NumberFormat('zh-TW',{style:'currency',currency:cur,minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.ceil(Number(n)||0));
    const dateFmt=d=>{if(!d)return '—';const m=String(d).trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?`${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`:'—'};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}
    function toast(msg){$('notice').textContent=msg;$('notice').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('notice').classList.remove('show'),2300)}
    function calc(e){return Math.ceil(Number(e.price)*(1+Number(e.fee||0)/100))}
    function itemMarkup(e){const total=calc(e),dateLabel=e.orderStatus==='unordered'?'未下單':dateFmt(e.orderDate);return `<article class="item ${e.received?'received':''}"><div class="item-top"><div><div class="item-title">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.name)} ↗</a>`:esc(e.name)}</div><div class="store">${esc(e.store)}</div></div></div><div class="item-bottom"><label class="received-toggle" title="已收到貨的商品會反灰"><input type="checkbox" data-received="${e.id}" ${e.received?'checked':''}> 已收貨</label><details class="more-menu"><summary aria-label="更多操作" title="更多操作">⋯</summary><div class="menu-pop"><button type="button" class="text-btn" data-edit="${e.id}">編輯</button><button type="button" class="text-btn" data-delete="${e.id}">刪除</button></div></details></div><div class="item-meta-row"><div class="meta"><label>下單日期</label><strong class="${e.orderStatus==='unordered'?'date-empty':''}">${dateLabel}</strong></div><div class="meta"><label>${e.preorder?'預購截止日期':'預計出貨日期'}</label><strong>${e.preorder?dateFmt(e.preorderDeadline):dateFmt(e.shipDate)}</strong></div><div class="meta total"><label>商品價格(含手續費)</label><strong>${fmt(total)}</strong></div></div></article>`}
    function render(){const detail=location.hash==='#list';$('homeView').classList.toggle('hidden',detail);$('listView').classList.toggle('hidden',!detail);searchTerm=(detail?$('allSearch').value:$('search').value).trim().toLowerCase();sortKey=detail?$('allSortBy').value:$('sortBy').value;$('search').value=$('allSearch').value=detail?$('allSearch').value:$('search').value;$('sortBy').value=$('allSortBy').value=sortKey;
      const counts={pending:entries.filter(e=>!e.received).length,received:entries.filter(e=>e.received).length};$('homePendingCount').textContent=$('allPendingCount').textContent=counts.pending;$('homeReceivedCount').textContent=$('allReceivedCount').textContent=counts.received;
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));$('statActive').innerHTML=`${counts.pending} <small>件商品</small>`;$('statShipping').innerHTML=`${entries.filter(e=>!e.received&&e.shipDate).length} <small>件商品</small>`;$('statTotal').textContent=fmt(entries.reduce((s,e)=>s+(calc(e)||0),0));
      let list=entries.filter(e=>(activeTab==='received'?e.received:!e.received)&&(!searchTerm||`${e.name} ${e.store}`.toLowerCase().includes(searchTerm)));list.sort((a,b)=>sortKey==='store'?dir*(a.store||'').localeCompare(b.store||'','zh-Hant'):dir*((a[sortKey]||'').localeCompare(b[sortKey]||'')));
      $('listCount').textContent=`${list.length} 件`;$('allListCount').textContent=`${list.length} 件`;$('seeMore').classList.toggle('hidden',list.length<=15);$('items').innerHTML=list.length?list.slice(0,15).map(itemMarkup).join(''):`<div class="empty"><div class="empty-icon">🛍</div><strong>${searchTerm?'找不到符合的商品':activeTab==='received'?'還沒有已收貨商品':'清單還是空的'}</strong><p>${searchTerm?'試試其他商品名稱或店家。':'新增商品後會顯示在這裡。'}</p></div>`;
      const pages=Math.max(1,Math.ceil(list.length/15));detailPage=Math.min(detailPage,pages);$('allItems').innerHTML=list.length?list.slice((detailPage-1)*15,detailPage*15).map(itemMarkup).join(''):`<div class="empty"><div class="empty-icon">🛍</div><strong>${searchTerm?'找不到符合的商品':activeTab==='received'?'還沒有已收貨商品':'清單還是空的'}</strong><p>${searchTerm?'試試其他商品名稱或店家。':'新增商品後會顯示在這裡。'}</p></div>`;$('pagination').innerHTML=pages>1?`<button class="page-btn" data-page="${detailPage-1}" ${detailPage===1?'disabled':''}>上一頁</button><span class="page-label">第 ${detailPage} / ${pages} 頁</span><button class="page-btn" data-page="${detailPage+1}" ${detailPage===pages?'disabled':''}>下一頁</button>`:''}
    function updateEstimate(){const p=Number($('price').value)||0;$('rateNote').textContent=`刷卡手續費 ${Number(settings.fee)}%`; $('estimate').textContent=fmt(Math.ceil(p*(1+Number(settings.fee)/100)))}
    function syncConditionalFields(){const ordered=$('orderStatus').value==='ordered',preorder=$('preorder').value==='yes';$('orderDateField').classList.toggle('hidden',!ordered);$('orderDate').required=ordered;$('orderDate').disabled=!ordered;$('preorderDeadlineField').classList.toggle('hidden',!preorder);$('preorderDeadline').required=preorder}
    function resetForm(){editing=null;$('itemForm').reset();$('orderDate').value=today;$('orderStatus').value='ordered';$('preorder').value='no';syncConditionalFields();$('formTitle').textContent='新增一筆採購';$('saveBtn').textContent='加入追蹤清單';$('cancelEdit').classList.add('hidden');updateEstimate()}
    $('itemForm').addEventListener('submit',ev=>{ev.preventDefault();const ordered=$('orderStatus').value==='ordered',isPreorder=$('preorder').value==='yes',base={name:$('name').value.trim(),url:$('url').value.trim(),store:$('store').value.trim(),orderStatus:$('orderStatus').value,orderDate:ordered?$('orderDate').value:'',shipDate:$('shipDate').value,preorder:isPreorder,preorderDeadline:isPreorder?$('preorderDeadline').value:'',price:Number($('price').value),currency:'TWD',rate:1,fee:Number(settings.fee)};if(editing){const old=entries.find(e=>e.id===editing);Object.assign(old,base)}else entries.unshift({id:crypto.randomUUID(),...base,createdAt:new Date().toISOString(),received:false});persist();render();toast(editing?'已更新採購紀錄':'已加入追蹤清單');resetForm()});
    function startEdit(e){editing=e.id;for(const [k,v] of Object.entries({name:e.name,url:e.url,store:e.store,orderDate:e.orderDate,shipDate:e.shipDate,preorderDeadline:e.preorderDeadline,price:e.price}))$(k).value=v||'';$('orderStatus').value=e.orderStatus||'ordered';$('preorder').value=e.preorder?'yes':'no';syncConditionalFields();$('formTitle').textContent='編輯採購紀錄';$('saveBtn').textContent='儲存變更';$('cancelEdit').classList.remove('hidden');updateEstimate();$('itemForm').scrollIntoView({behavior:'smooth',block:'start'})}
    function itemChanged(ev){const id=ev.target.dataset.received;if(!id)return;const e=entries.find(x=>x.id===id);if(e&&ev.target.checked&&!confirm(`確認已收到「${e.name}」的商品嗎？`)){ev.target.checked=false;return}if(e){e.received=ev.target.checked;persist();render()}}
    function itemAction(ev){const del=ev.target.dataset.delete,edit=ev.target.dataset.edit;if(del){entries=entries.filter(x=>x.id!==del);persist();render();toast('已刪除紀錄')}if(edit){const e=entries.find(x=>x.id===edit);if(!e)return;if(location.hash==='#list'){location.hash='home';setTimeout(()=>startEdit(e),0)}else startEdit(e)}}
    ['items','allItems'].forEach(id=>{$(id).addEventListener('change',itemChanged);$(id).addEventListener('click',itemAction)});
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;detailPage=1;render()}));
    $('pagination').addEventListener('click',ev=>{if(ev.target.dataset.page){detailPage=Number(ev.target.dataset.page);render();$('listView').scrollIntoView({block:'start',behavior:'smooth'})}});
    function syncSearch(){ $('allSearch').value=$('search').value;detailPage=1;render() }
    $('search').addEventListener('input',syncSearch);$('allSearch').addEventListener('input',()=>{$('search').value=$('allSearch').value;detailPage=1;render()});
    $('sortBy').addEventListener('change',()=>{$('allSortBy').value=$('sortBy').value;detailPage=1;render()});$('allSortBy').addEventListener('change',()=>{$('sortBy').value=$('allSortBy').value;detailPage=1;render()});
    function toggleDir(){dir*=-1;$('sortDir').textContent=$('allSortDir').textContent=dir<0?'↓':'↑';detailPage=1;render()}$('sortDir').addEventListener('click',toggleDir);$('allSortDir').addEventListener('click',toggleDir);
    window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'auto'})});
    $('cancelEdit').addEventListener('click',resetForm);$('price').addEventListener('input',updateEstimate);$('orderStatus').addEventListener('change',syncConditionalFields);$('preorder').addEventListener('change',syncConditionalFields);
    $('openSettings').addEventListener('click',()=>{$('fee').value=settings.fee;$('settingsDialog').showModal()});$('closeSettings').addEventListener('click',()=>$('settingsDialog').close());$('settingsForm').addEventListener('submit',ev=>{ev.preventDefault();settings.fee=Math.max(0,Number($('fee').value)||0);localStorage.setItem(SETKEY,JSON.stringify(settings));entries.forEach(e=>e.fee=settings.fee);persist();$('settingsDialog').close();updateEstimate();render();toast(`手續費率已設為 ${settings.fee}%`)});
    $('orderDate').value=today;syncConditionalFields();render();updateEstimate();
  })();
  </script>
</body>
</html>
