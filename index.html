<body><main class="app">
<header class="top"><div class="brand"><div class="mark">◫</div><span>時程工作台</span></div><div class="topRight"><span class="eyebrow">我的工作區</span><div class="avatar">我</div></div></header>
<section id="listView"><div class="heading"><div><div class="eyebrow">PROJECTS</div><h1>專案列表</h1><p>選擇專案查看進度，或建立新的專案。</p></div><div class="toolbar"><button class="btn" data-action="export-backup">匯出備份</button><button class="btn" data-action="import-backup">匯入備份</button><button class="btn primary" data-action="new-project">＋ 新增專案</button></div></div><div id="projectGrid" class="projectGrid"></div><input id="backupFile" type="file" accept=".json,application/json" hidden></section>
<section id="detailView" hidden><div class="heading detailHeading"><div><button class="back" data-action="back">← 返回專案列表</button></div><button class="btn" data-action="logs">查看變更紀錄</button></div>
<div class="stats"><div class="card statCard"><label>專案名稱</label><input id="projectName" class="projectNameInput" maxlength="80" aria-label="專案名稱"></div><div class="card statCard"><div class="dateHeader"><label>專案日期</label><button id="saveProjectDates" class="btn small" type="button" disabled>儲存</button></div><div class="datesInput"><input id="projectStart" class="input" type="date" aria-label="專案起始日期"><span>–</span><input id="projectEnd" class="input" type="date" aria-label="專案結束日期"></div><div id="projectDuration" class="sub"></div></div><div class="card statCard"><label>任務完成</label><div class="statValue"><span id="doneCount">0</span><span style="font-size:13px;color:#849189;font-weight:500"> / <span id="totalCount">0</span></span></div></div></div>
<section class="panel"><div class="panelHead"><div><div class="panelTitle">專案甘特圖</div><div class="sub">拖曳任務色塊移動日期，拖曳右側控點調整工期</div></div><div class="toolbar"><label class="toggle"><button id="weekendToggle" class="switch" aria-label="納入週末"></button>甘特圖納入週末</label><button class="btn small" data-action="today">今天</button><button class="btn small primary" data-action="new-task">＋ 新增項目</button></div></div><div class="ganttWrap"><div id="gantt" class="gantt"></div></div><div class="hint">完成任務請勾選名稱旁方框；已完成任務會以灰色呈現。日期與代辦事項會自動儲存。</div></section>
<div class="bottomGrid"><section class="listPanel"><div class="listHead"><div class="panelTitle">代辦事項</div><div class="sub">輸入事項，再選擇待辦或已完成</div></div><form id="todoForm" class="addTodo"><input id="todoInput" class="input" maxlength="120" placeholder="輸入代辦事項…" required><button class="btn small primary" type="submit">新增</button></form><div id="todoList"></div></section><section class="listPanel"><div class="listHead"><div class="panelTitle">里程碑</div><div class="sub">專案中的關鍵日期</div></div><div id="milestoneList"></div></section></div>
</section>
<section id="logView" hidden><div class="heading"><div><button class="back" data-action="log-back">← 返回專案</button><h1 id="logTitle">變更紀錄</h1><p>查詢這個專案的任務與項目異動。</p></div></div><section class="panel"><div class="panelHead"><div><div class="panelTitle">變更紀錄</div><div class="sub">依時間由新到舊排列</div></div><input id="logSearch" class="input" placeholder="搜尋項目或變更內容…" aria-label="搜尋變更紀錄"></div><div id="logList"></div></section></section>
</main>
<div id="modalBack" class="modalBack"><div class="modal"><h2 id="modalTitle">新增項目</h2><form id="itemForm"><input id="editId" type="hidden"><div class="formGrid"><div class="field full"><label for="itemName">項目名稱</label><input id="itemName" required maxlength="80" placeholder="例如：完成首頁視覺設計"></div><div class="field"><label for="itemStart">起始日期</label><input id="itemStart" type="date" required></div><div class="field"><label for="itemEnd">結束日期</label><input id="itemEnd" type="date" required></div><div class="field"><label for="itemColor">標籤色彩</label><select id="itemColor"><option value="#579070">森林綠</option><option value="#6c96c9">天空藍</option><option value="#cf7771">珊瑚紅</option><option value="#d5a044">暖陽黃</option></select></div><label class="check" style="align-self:end;padding-bottom:10px"><input id="itemMilestone" type="checkbox"> 設為里程碑</label><div id="dependencyField" class="field full dependencyField"><label>綁定項目</label><div id="dependencyOptions" class="dependencyOptions"></div><div class="dependencyHelp">可選多個綁定項目；調整來源項目的日期時，綁定項目會同步移動，日期可以重疊。</div></div></div><div class="modalActions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">儲存項目</button></div></form></div></div><div id="toast" class="toast"></div>

function exportBackup(){const backup={format:'project-planner-backup',version:1,exportedAt:new Date().toISOString(),activeId,projects};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`project-planner-backup-${iso(today)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('備份檔已下載')}
async function importBackup(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>8*1024*1024)throw new Error('檔案超過 8 MB');const backup=JSON.parse(await file.text());if(backup.format!=='project-planner-backup'||backup.version!==1||!Array.isArray(backup.projects))throw new Error('這不是支援的專案備份檔');for(const p of backup.projects){if(!p||typeof p.id!=='string'||typeof p.project!=='string'||!Array.isArray(p.tasks))throw new Error('備份資料格式不完整');p.tasks.forEach(t=>{if(!t||typeof t.id!=='string'||typeof t.name!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.start)||!/^\d{4}-\d{2}-\d{2}$/.test(t.end)||!/^#[\da-f]{6}$/i.test(t.color||''))throw new Error('備份中有無效任務資料');if(!Array.isArray(t.dependsOn))t.dependsOn=[]});if(!Array.isArray(p.todos))p.todos=[];if(!Array.isArray(p.logs))p.logs=[]}if(!confirm(`將匯入 ${backup.projects.length} 個專案，並取代這台電腦目前的專案資料。請先確認有需要保留的資料已匯出備份。`))return;const oldProjects=projects,oldActive=activeId,oldWorkspace=localStorage.getItem(WORK),oldCurrent=localStorage.getItem(KEY);projects=backup.projects;activeId=projects.some(p=>p.id===backup.activeId)?backup.activeId:(projects[0]?.id||null);try{persist()}catch(err){projects=oldProjects;activeId=oldActive;try{oldWorkspace===null?localStorage.removeItem(WORK):localStorage.setItem(WORK,oldWorkspace);oldCurrent===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,oldCurrent)}catch{}throw new Error('瀏覽器儲存空間不足，匯入未完成')}showList();toast('專案資料已匯入')}catch(err){toast(err.message||'無法讀取備份檔')}finally{event.target.value=''}}
function saveForm(e){e.preventDefault();const name=$('#itemName').value.trim(),start=$('#itemStart').value,end=$('#itemEnd').value;if(!name)return;if(end<start){toast('結束日期不能早於起始日期');return}if($('#itemForm').dataset.mode==='project'){const p={id:id(),project:name,start,end,weekends:false,tasks:[],todos:[],logs:[]};projects.push(p);activeId=p.id;persist();closeModal();showDetail();return}const p=active(),eid=$('#editId').value,dependsOn=[...$('#dependencyOptions').querySelectorAll('input:checked')].map(x=>x.value),t={id:eid||id(),name,start,end,color:$('#itemColor').value,milestone:$('#itemMilestone').checked,dependsOn},i=p.tasks.findIndex(x=>x.id===eid);if(i>=0){const old=p.tasks[i],before={...old,dependsOn:[...(old.dependsOn||[])]},changes=[];old.dependsOn=dependsOn;const schedule=setTaskDates(p,old,start,end);t.start=old.start;t.end=old.end;if(before.name!==t.name)changes.push(`名稱：${before.name} → ${t.name}`);if(before.start!==t.start||before.end!==t.end)changes.push(`日期：${before.start} – ${before.end} → ${t.start} – ${t.end}`);if(!!before.milestone!==t.milestone)changes.push(t.milestone?'設為里程碑':'取消里程碑');if(before.color!==t.color)changes.push('標籤色彩已調整');if(before.dependsOn.join(',')!==dependsOn.join(',')){const labels=dependsOn.map(key=>p.tasks.find(x=>x.id===key)?.name).filter(Boolean);changes.push(labels.length?`綁定項目：${labels.join('、')}`:'已解除綁定')}if(changes.length)record(p,'編輯',t.name,changes.join('；'));p.tasks[i]={...old,...t}}else{t.done=false;t.status='active';p.tasks.push(t);setTaskDates(p,t,start,end);record(p,'新增',t.name,`新增項目（${t.start} – ${t.end}）${t.milestone?'，設為里程碑':''}${dependsOn.length?'，設定前置項目':''}`)}persist();closeModal();renderDetail()}
function deleteItem(itemId){if(!confirm('確定刪除此項目？'))return;const p=active(),item=p.tasks.find(t=>t.id===itemId);if(item)record(p,'刪除',item.name,`刪除任務（${fmt(item.start)} – ${fmt(item.end)}）`);if(item)for(const t of p.tasks)if((t.dependsOn||[]).includes(itemId)){t.dependsOn=t.dependsOn.filter(x=>x!==itemId);record(p,'前置項目移除',t.name,`已解除「${item.name}」的前置關係`)}p.tasks=p.tasks.filter(t=>t.id!==itemId);persist();renderDetail()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function startDrag(e){const bar=e.currentTarget,p=active(),t=p.tasks.find(x=>x.id===bar.dataset.bar);if(!t||t.milestone)return;const resizing=e.target.classList.contains('barHandle'),start=parse(t.start),end=parse(t.end),width=bar.parentElement.clientWidth,x=e.clientX;let delta=0;bar.setPointerCapture(e.pointerId);bar.onpointermove=ev=>{delta=Math.round((ev.clientX-x)/(width/days));if(resizing){const length=Math.max(1,(end-start)/86400000+1+delta);bar.style.width=(length/days*100)+'%'}else bar.style.transform=`translateX(${delta*width/days}px)`};bar.onpointerup=()=>{if(!delta)return;const newStart=resizing?start:add(start,delta),newEnd=resizing?add(end,delta):add(end,delta),beforeStart=t.start,beforeEnd=t.end;setTaskDates(p,t,iso(newStart),iso(newEnd));if(t.start!==beforeStart||t.end!==beforeEnd)record(p,'調整時程',t.name,`日期：${beforeStart} – ${beforeEnd} → ${t.start} – ${t.end}`);persist();renderDetail()}}
const ganttWrap=$('.ganttWrap');let panState=null;
ganttWrap.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.bar,.taskInfo,.labelHead'))return;const area=e.target.closest('.timeline,.timelineCell');if(!area)return;panState={x:e.clientX,left:ganttWrap.scrollLeft,pointerId:e.pointerId};ganttWrap.classList.add('isPanning');ganttWrap.setPointerCapture(e.pointerId);e.preventDefault()});
ganttWrap.addEventListener('pointermove',e=>{if(!panState||e.pointerId!==panState.pointerId)return;ganttWrap.scrollLeft=panState.left-(e.clientX-panState.x)});
const stopPan=e=>{if(!panState||e.pointerId!==panState.pointerId)return;panState=null;ganttWrap.classList.remove('isPanning')};
ganttWrap.addEventListener('pointerup',stopPan);ganttWrap.addEventListener('pointercancel',stopPan);ganttWrap.addEventListener('lostpointercapture',stopPan);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'new-project':openProject();break;case'new-task':openItem();break;case'back':showList();break;case'logs':showLogs();break;case'log-back':$('#logView').hidden=true;showDetail();break;case'export-backup':exportBackup();break;case'import-backup':$('#backupFile').click();break;case'close-modal':closeModal();break;case'today':scrollToToday();break}});
$('#itemForm').addEventListener('submit',saveForm);$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});$('#backupFile').addEventListener('change',importBackup);$('#todoForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#todoInput'),text=input.value.trim();if(!text)return;const p=active();p.todos.push({id:id(),text,status:'todo'});record(p,'新增代辦',text,'新增代辦事項');input.value='';persist();renderTodos();input.focus()});$('#logSearch').addEventListener('input',renderLogs);
$('#projectName').addEventListener('change',()=>{const p=active(),before=p.project;p.project=$('#projectName').value.trim()||'未命名專案';if(before!==p.project)record(p,'修改專案名稱','專案資料',`${before} → ${p.project}`);persist()});const dateFields=['projectStart','projectEnd'];function updateDateSave(){const p=active();$('#saveProjectDates').disabled=$('#projectStart').value===p.start&&$('#projectEnd').value===p.end}for(const field of dateFields)$('#'+field).addEventListener('change',updateDateSave);$('#saveProjectDates').addEventListener('click',()=>{const p=active(),s=$('#projectStart').value,e=$('#projectEnd').value;if(!s||!e){toast('請選擇完整的專案日期');return}if(e<s){toast('結束日期不能早於起始日期');return}const oldStart=p.start,oldEnd=p.end;if(oldStart!==s||oldEnd!==e){p.start=s;p.end=e;record(p,'修改專案日期','專案資料',`${oldStart} – ${oldEnd} → ${s} – ${e}`);persist();renderDetail();toast('專案日期已儲存')}});$('#weekendToggle').addEventListener('click',()=>{active().weekends=!active().weekends;persist();renderDetail()});
load();projects.forEach(p=>{if(!Array.isArray(p.logs))p.logs=[]});ensureHardwareSample();showList();
})();
</script></body></html>
